<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>佐渡市IT教育事業｜AI寺子屋 2026</title>
  <meta name="description" content="令和8年度 佐渡市IT教育事業 AI寺子屋の講座テキスト">
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      color: #17333b;
      background: #eaf4f2;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 24px;
      background: linear-gradient(135deg, #063f44 0%, #087f73 52%, #0b6fa4 100%);
    }
    .panel {
      width: min(720px, 100%);
      padding: clamp(30px, 7vw, 62px);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 22px 60px rgba(1, 45, 51, 0.28);
    }
    .label { margin: 0 0 10px; color: #087f73; font-size: 13px; font-weight: 900; letter-spacing: 0.12em; }
    h1 { margin: 0; color: #123d48; font-size: clamp(34px, 8vw, 58px); line-height: 1.12; }
    .lead { margin: 18px 0 30px; color: #52656c; font-size: 17px; line-height: 1.8; }
    .lessons { display: grid; gap: 14px; }
    .lesson {
      display: block;
      padding: 22px;
      border: 2px solid #8ccabe;
      border-radius: 16px;
      color: #fff;
      background: #087f73;
      text-decoration: none;
      box-shadow: 0 10px 22px rgba(8, 127, 115, 0.18);
    }
    .lesson small { display: block; margin-bottom: 5px; color: #c9fff3; font-weight: 800; }
    .lesson strong { display: block; font-size: clamp(20px, 5vw, 27px); line-height: 1.45; }
    .lesson span { display: block; margin-top: 8px; color: rgba(255, 255, 255, 0.86); }
    .lesson:hover, .lesson:focus-visible { background: #066a60; transform: translateY(-1px); }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <p class="label">令和8年度 佐渡市IT教育事業</p>
      <h1>AI寺子屋</h1>
      <p class="lead">講座の日付・回次を選んで、当日のテキストを開いてください。</p>
      <div class="lessons">
        <a class="lesson" href="01/">
          <small>第1日目</small>
          <strong>AIの全体像と、はじめてのHTML</strong>
          <span>テキストを開く →</span>
        </a>
        <a class="lesson" href="02/">
          <small>第2日目</small>
          <strong>ファイルとExcelをAIで加工する</strong>
          <span>テキストと演習ファイルを開く →</span>
        </a>
        <a class="lesson" href="03/">
          <small>第3回｜2026年9月10日</small>
          <strong>困りごとと業務フローを整理する</strong>
          <span>テキストと演習ファイルを開く →</span>
        </a>
        <a class="lesson" href="04/">
          <small>第4回</small>
          <strong>小さな試作品の制作</strong>
          <span>テキスト・制作の手引き・動作見本を開く →</span>
        </a>
        <a class="lesson" href="05/">
          <small>第5回</small>
          <strong>作品を作り切ろう</strong>
          <span>テキストを開く →</span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
